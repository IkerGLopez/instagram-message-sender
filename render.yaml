services:
  # 1. Web Service (Fastify Server)
  - type: web
    name: instagram-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: instagram-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Añade aquí tus secretos de Instagram manualmente en el dashboard de Render
      # - key: INSTAGRAM_APP_ID
      # - key: INSTAGRAM_APP_SECRET
      # ...

  # 2. Background Worker (BullMQ Processor)
  - type: worker
    name: instagram-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/worker.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: instagram-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: NODE_ENV
        value: production
      # Mismos secretos de Instagram que el servidor

databases:
  - name: instagram-db
    databaseName: instagram_retention
    user: dev

  # Render no tiene Redis nativo gratuito en el plan free, 
  # pero puedes usar Upstash (gratis) y poner la URL en las env vars.
  # Si usas el plan paid de Render, descomenta esto:
  # - type: redis
  #   name: instagram-redis
  #   ipAllowList: [] # Allow all

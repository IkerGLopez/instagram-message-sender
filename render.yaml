services:
  # 1. Web Service (Fastify Server + Worker merged for Free Tier)
  - type: web
    name: instagram-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Database (External - Neon recommended for free tier)
      - key: DATABASE_URL
        sync: false
      # Redis (External - Upstash recommended for free tier)
      - key: REDIS_URL
        sync: false
      # Environment
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Instagram Secrets (User must provide these)
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_PAGE_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
      # App Config
      - key: TRIGGER_KEYWORD
        sync: false
      - key: STATIC_DISCOUNT_CODE
        sync: false
